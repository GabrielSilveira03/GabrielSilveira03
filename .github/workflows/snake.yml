name: Generate snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: GabrielSilveira03
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=bb9af7&color_dots=#1a1b27,#2d3154,#3f4a81,#5c73c2,#7aa2f7
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
